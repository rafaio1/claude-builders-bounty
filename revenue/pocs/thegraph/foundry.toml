[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "ds-test/=lib/ds-test/src/",
    "@graphprotocol/interfaces/contracts/=src/interfaces/"
]
solc_version = "0.7.6"
evm_version = "istanbul"
