name: 'Claude PR Review'
description: 'Automated structured PR review'
inputs:
  pr_number: {description: 'PR number', required: true}
  github_token: {description: 'GitHub token', required: true}
runs:
  using: 'composite'
  steps:
    - shell: bash
      env: {GH_TOKEN: '${{ inputs.github_token }}'}
      run: python3 ${{ github.action_path }}/claude-review.py --pr "${{ github.repository }}#${{ inputs.pr_number }}"
