              - generic [ref=e201]:
                - generic [ref=e202]: Rewards Body
                - generic [ref=e205]:
                  - paragraph [ref=e206]:
                    - text: Rewards are distributed according to the impact of the vulnerability based on the Immunefi
                    - link "Vulnerability Severity Classification System V2.3" [ref=e207] [cursor=pointer]:
                      - /url: https://immunefi.com/immunefi-vulnerability-severity-classification-system-v2-3/
                    - text: .
                  - paragraph [ref=e208]:
                    - strong [ref=e209]: Reward Calculation for Critical Level Reports
                  - paragraph [ref=e210]:
                    - text: For critical smart contract bugs, the reward amount is
                    - strong [ref=e211]: 10%
                    - text: of the funds directly affected up to a maximum of
                    - strong [ref=e212]: USD 100,000
                    - text: . The calculation of the amount of funds at risk is based on the time and date the bug report is submitted. However, a minimum reward of
                    - strong [ref=e213]: USD 20,000
                    - text: is to be rewarded in order to incentivize security researchers against withholding a critical bug report.
                  - paragraph [ref=e214]:
                    - strong [ref=e215]: Repeatable Attack Limitations
                  - list [ref=e216]:
                    - listitem [ref=e217]:
                      - paragraph [ref=e218]: If the smart contract where the vulnerability exists can be upgraded or paused, only the initial attack will be considered for a reward. This is because the project can mitigate the risk of further exploitation by upgrading or pausing the component where the vulnerability exists. The reward amount will depend on the severity of the impact and the funds at risk.
                    - listitem [ref=e219]:
                      - paragraph [ref=e220]: For critical repeatable attacks on smart contracts that cannot be upgraded or paused, the project will consider the cumulative impact of the repeatable attacks for a reward. This is because the project cannot prevent the attacker from repeatedly exploiting the vulnerability until all funds are drained and/or other irreversible damage is done. Therefore, this warrants a reward equivalent to 10% of funds at risk, capped at the maximum critical reward.
                  - paragraph [ref=e221]:
                    - strong [ref=e222]: Reward Calculation for High Level Reports
                  - list [ref=e223]:
                    - listitem [ref=e224]:
                      - paragraph [ref=e225]:
                        - text: High vulnerabilities concerning theft/permanent freezing of unclaimed yield/royalties are rewarded within a range of
                        - strong [ref=e226]: USD 1,000 to 20,000
                        - text: depending on the funds at risk, capped at the maximum high reward.
                    - listitem [ref=e227]:
                      - paragraph [ref=e228]: In the event of temporary freezing, the reward doubles from the full frozen value for every additional 24h that the funds are temporarily frozen, up until a max cap of the high reward. This is because as the duration of the freezing lengthens, the potential for greater damage and subsequent reputational harm intensifies. Thus, by increasing the reward proportionally with the frozen duration, the project ensures stronger incentives for bug disclosure of this nature.
                  - paragraph [ref=e229]:
                    - strong [ref=e230]: Reward Payment Terms
                  - paragraph [ref=e231]:
                    - text: Payouts are handled by the
                    - strong [ref=e232]: StackingDAO
                    - text: team directly and are denominated in
                    - strong [ref=e233]: USD
                    - text: . However, payments are done in
                    - strong [ref=e234]: USDC on Ethereum Network
                    - text: .
                  - paragraph [ref=e235]: The calculation of the net amount rewarded is based on the average price between CoinMarketCap.com and CoinGecko.com at the time the bug report was submitted. No adjustments are made based on liquidity availability.
              - link "View impacts in scope" [ref=e237] [cursor=pointer]:
