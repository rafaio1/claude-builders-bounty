                - paragraph [ref=e257]:
                  - strong [ref=e258]: Primacy of Impact vs Primacy of Rules
                - paragraph [ref=e259]: "StackingDAO adheres to the Primacy of Impact for the following impacts:"
                - list [ref=e260]:
                  - listitem [ref=e261]: Smart Contracts, Critical severity
                  - listitem [ref=e262]: Smart Contracts, High severity
                - paragraph [ref=e263]:
                  - text: Primacy of Impact means that the impact is prioritized rather than a specific asset. This encourages security researchers to report on all bugs with an in-scope impact, even if the affected assets are not in scope. For more information, please see
                  - 'link "Best Practices: Primacy of Impact" [ref=e264] [cursor=pointer]':
                    - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/12340245635089-Best-Practices-Primacy-of-Impact?utm_source=immunefi
                  - text: .
                - paragraph [ref=e265]: When submitting a report on Immunefi’s dashboard, the security researcher should select the Primacy of Impact asset placeholder. If the team behind this project has multiple programs, those other programs are not covered under Primacy of Impact for this program. Instead, check if those other projects have a bug bounty program on Immunefi.
                - paragraph [ref=e266]: If the project has any testnet and/or mock files, those will not be covered under Primacy of Impact.
                - paragraph [ref=e267]: All other impacts are considered under the Primacy of Rules, which means that they are bound by the terms and conditions set within this program.
                - paragraph [ref=e268]:
                  - strong [ref=e269]: Proof of Concept (PoC) Requirements
                - paragraph [ref=e270]:
                  - text: A PoC, demonstrating the bug's impact, is required for this program and has to comply with the
                  - link "Immunefi PoC Guidelines and Rules" [ref=e271] [cursor=pointer]:
                    - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/9946217628561-Proof-of-Concept-PoC-Guidelines-and-Rules?utm_source=immunefi
                  - text: .
                - paragraph [ref=e272]:
