                - heading "Primacy of Impact vs Primacy of Rules" [level=3] [ref=e276]
                - generic [ref=e285]:
                  - paragraph [ref=e286]: Primacy of Impact means that the impact is prioritized rather than a specific asset. This encourages security researchers to report on all bugs with an in-scope impact, even if the affected assets are not in scope.
                  - paragraph [ref=e287]:
                    - text: For more information, please see
                    - 'link "Best Practices: Primacy of Impact" [ref=e288] [cursor=pointer]':
                      - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/12340245635089-Best-Practices-Primacy-of-Impact?utm_source=immunefi
                    - text: .
                  - paragraph [ref=e289]: When submitting a report on Immunefi's dashboard, the security researcher should select the Primacy of Impact asset placeholder. If the team behind this project has multiple programs, those other programs are not covered under Primacy of Impact for this program. Instead, check if those other projects have a bug bounty program on Immunefi.
                  - paragraph [ref=e290]: If the project has any testnet and/or mock files, those will not be covered under Primacy of Impact.
                  - paragraph [ref=e291]: All other impacts are considered under the Primacy of Rules, which means that they are bound by the terms and conditions set within this program.
              - generic [ref=e292]:
                - generic [ref=e293]: Rewards Body
                - generic [ref=e296]:
                  - paragraph [ref=e297]: Rewards are distributed according to the impact the vulnerability could otherwise cause based on the Impacts in Scope table further below.
                  - paragraph [ref=e298]:
                    - text: For critical Smart Contract bugs, the reward amount is
                    - strong [ref=e299]: 10%
                    - text: of the funds directly affected up to a maximum of
                    - strong [ref=e300]: USD 50 000
                    - text: . The calculation of the amount of funds at risk is based on the time and date the bug report is submitted. However, a minimum reward of
                    - strong [ref=e301]: USD 10 000
                    - text: is to be rewarded in order to incentivize security researchers against withholding a bug report.
                  - paragraph [ref=e302]:
                    - text: Critical website and application bug reports will be rewarded with
                    - strong [ref=e303]: USD 10 000
                    - text: ", only if the impact leads to a direct loss in funds involving an attack that does not require any user action at all. Additionally any impact that leads to “Retrieve sensitive data/files from a running server such as: database passwords,blockchain keys, etc (this does not include non-sensitive environment variables, open source code, or usernames” and to “Execute arbitrary system commands” would be rewarded USD 10 000 USD, which is 2x the standard amount for Web/App critical impact. All other impacts that would be classified as Critical, or an impact resulting in a theft of funds that does not fall under this definition, would be rewarded"
                    - strong [ref=e304]: USD 5 000
                    - text: .
                  - paragraph [ref=e305]:
                    - strong [ref=e306]: Repeatable Attack Limitations
                  - paragraph [ref=e307]: In cases of repeatable attacks for smart contract bugs, only the first attack is considered if the smart contracts where the vulnerability exists can be upgraded, paused, or killed. If the attack impacts a smart contract directly holding funds that cannot be upgraded or paused, the amount of funds at risk will be calculated with the first attack being at 100% of the funds that could be stolen and then a reduction of 25% from the amount of the first attack for every 300 blocks the attack needs for subsequent attacks from the first attack, rounded down. For avoidance of doubt, if a second attack would happen at 600 blocks and then a third at 900 blocks, the funds at risk would be counted at 50% and 25% of the reward from the first attack, respectively.
                  - paragraph [ref=e308]:
                    - strong [ref=e309]: Reward Calculation for High Level Reports
                    - text: High smart contract vulnerabilities will be capped at up to 100% of the funds affected. In the event of temporary freezing, the reward doubles for every additional 5 blocks that the funds could be temporarily frozen, rounded down to the nearest multiple of 5, up to the hard cap of USD 10 000 USD.
                  - paragraph [ref=e310]:
                    - strong [ref=e311]: Restrictions on Security Researcher Eligibility
                  - paragraph [ref=e312]: Security researchers who fall under any of the following are ineligible for a reward
                  - list [ref=e313]:
                    - listitem [ref=e314]: Countries that are restricted by OFAC and by UNSC resolutions.
                  - paragraph [ref=e315]:
                    - strong [ref=e316]: Public Disclosure of Known Issues
                  - paragraph [ref=e317]: Bug reports covering previously-discovered bugs acknowledged below are not eligible for any reward through the bug bounty program.
                  - list [ref=e318]:
                    - listitem [ref=e319]:
                      - text: "Any well-known issues related to Gnosis Safe:"
                      - link "https://docs.gnosis-safe.io/learn/security/security-audits" [ref=e320] [cursor=pointer]:
                        - /url: https://docs.gnosis-safe.io/learn/security/security-audits?utm_source=immunefi
                  - paragraph [ref=e321]:
                    - strong [ref=e322]: Previous Audits
                    - text: Immunefi has provided these completed audit review reports for reference. Any unfixed vulnerability mentioned in these reports are not eligible for a reward.
                  - list [ref=e323]:
                    - listitem [ref=e324]:
                      - text: Here’s the
                      - link "internal audit" [ref=e325] [cursor=pointer]:
                        - /url: https://github.com/immunefi-team/vaults-splitter/blob/main/audits/2023-02-03%20-%20Immunefi%20-%20Internal%20Audit%20of%20the%20Vaults%20system.pdf?utm_source=immunefi
                      - text: of the Vaults System
                    - listitem [ref=e326]:
                      - text: Here’s the
                      - link "Ourovoros audit" [ref=e327] [cursor=pointer]:
                        - /url: https://github.com/immunefi-team/vaults-splitter/blob/main/audits/2023-02-13%20-%20Ourovoros%20Audit.md?utm_source=immunefi
                      - text: of the Vaults System
                  - paragraph [ref=e328]:
                    - strong [ref=e329]: Feasibility Limitations
                  - paragraph [ref=e330]: "Bug reports that require an attack that involve one or more other protocols (e.g. utilizing flash loans from a margin protocol or manipulating the spot prices on a DEX), either to make an attack more severe than it would be in isolation, or to achieve an attack that would otherwise be impossible or infeasible, would be downgrade by one severity level. However, they will be considered as in-scope and categorized according to the program rules as long as all of the following are true:"
                  - list [ref=e331]:
                    - listitem [ref=e332]:
                      - paragraph [ref=e333]: Losses or other negative effects of the attack are inflicted upon Immunefi ecosystem participants (including Immunefi’s customers)
                    - listitem [ref=e334]:
                      - paragraph [ref=e335]: "The additional protocols used must have enough liquidity in various assets to allow the attack to succeed at the time of bug report submission. For example: if an attack requires an ETH flash loan, but the amount is larger than all the ETH available for loan across the ecosystem"
                  - paragraph [ref=e336]:
                    - strong [ref=e337]: Proof of Concept (PoC) Requirements
                  - paragraph [ref=e338]: "A PoC is required for the following severity levels:"
                  - list [ref=e339]:
                    - listitem [ref=e340]: All Smart Contract bug reports
                  - paragraph [ref=e341]:
                    - text: All PoCs submitted must comply with the Immunefi-wide
                    - link "PoC Guidelines and Rules" [ref=e342] [cursor=pointer]:
                      - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/9946217628561-Proof-of-Concept-PoC-Guidelines-and-Rules?utm_source=immunefi
                    - text: . Bug report submissions without a PoC when a PoC is required will not be provided with a reward.
                  - paragraph [ref=e343]:
                    - strong [ref=e344]: Other Terms and Information
                  - paragraph [ref=e345]: Broken link hijacking of social handles on any social media website will be downgraded to Informational, and a goodwill payout will be rewarded by Immunefi.
                  - paragraph [ref=e346]: Bug reports covering previously-discovered bugs are not eligible for the program. If a bug report covers a known issue, it may be rejected, and Immunefi will provide proof that the issue is already known.
                  - paragraph [ref=e347]:
                    - strong [ref=e348]: Reward Payment Terms
                  - paragraph [ref=e349]: Payouts are handled by the Immunefi team directly and are denominated in USD. However, payments are done in USDC
              - link "View impacts in scope" [ref=e351] [cursor=pointer]:
