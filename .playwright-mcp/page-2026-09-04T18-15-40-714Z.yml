            - generic [ref=e355]:
              - heading "Program Overview" [level=3] [ref=e357]
              - generic [ref=e364]:
                - paragraph [ref=e365]: Immunefi is the leading bug bounty platform on web3 with the world’s largest bounties.
                - paragraph [ref=e366]: Immunefi is interested in securing their beta release Vaults System and website. Primary areas of concern are around the modification of information on the website, leakage and loss of client data, leakage of communicated information from clients to the company, and loss of assets in the vaults.
                - paragraph [ref=e367]: Immunefi is aiming to decentralize the bug bounty space to provide more trust between whitehats and projects through releasing a smart contract Vaults System.
                - paragraph [ref=e368]: "The first iteration of this Vaults System contains two features: 1) projects on Immunefi can demonstrate proof-of-assets by depositing assets into vaults that are ready to be used to pay out bounties, and 2) projects can conduct payments to whitehats fully on-chain within the Immunefi dashboard."
                - paragraph [ref=e369]:
                  - text: For more information about Immunefi, please visit
                  - link "www.immunefi.com" [ref=e370] [cursor=pointer]:
                    - /url: https://www.immunefi.com/?utm_source=immunefi
                - paragraph [ref=e371]:
                  - text: Immunefi provides rewards in
                  - strong [ref=e372]: USDC
                  - text: . For more details about the payment process, please view the Rewards by Threat Level section further below.
                - paragraph [ref=e373]:
                  - strong [ref=e374]: KYC Requirement
                - paragraph [ref=e375]: "The provision of KYC is required to receive a reward for this bug bounty program where the following information will be required to be provided:"
                - list [ref=e376]:
                  - listitem [ref=e377]: For all submissions, Immunefi may request the researcher's country of residence before releasing payment. Some countries are restricted when it comes to payments. This bug bounty program is only open to individuals who reside outside of the countries that are restricted by OFAC and by UNSC resolutions.
                - paragraph [ref=e378]: For critical submissions, Immunefi will request government identification. KYC verification will be completed by an external service before payment can be released.
                - paragraph [ref=e379]: KYC information is only required on confirmation of the validity of a bug report.
                - paragraph [ref=e380]:
                  - strong [ref=e381]: Primacy of Impact vs Primacy of Rules
                - paragraph [ref=e382]: "Immunefi adheres to the Primacy of Impact for the following severity levels:"
                - list [ref=e383]:
                  - listitem [ref=e384]: Smart Contract Critical
                  - listitem [ref=e385]: Smart Contract High
                  - listitem [ref=e386]: Smart Contract Medium
                  - listitem [ref=e387]: Smart Contract Low
                  - listitem [ref=e388]: Web/App Critical
                  - listitem [ref=e389]: Web/App High
                  - listitem [ref=e390]: Web/App Medium
                  - listitem [ref=e391]: Web/App Low
                - paragraph [ref=e392]: If a category’s severity level is covered within the Primacy of Impact, it means that even if the impacted asset is not in-scope but is owned by the project, then it would be considered as in-scope of the bug bounty program as long as it involves an impact under that respective severity level. When submitting a report, just select the Primacy of Impact asset placeholder. If the team behind this project has multiple projects, those other projects are not covered under the Primacy of Impact of this program. Instead, check if those other projects have a bug bounty program on Immunefi.
                - paragraph [ref=e393]: Testnet and mock files are not covered under the Primacy of Impact.
                - paragraph [ref=e394]: All other severity levels not listed here are considered under the Primacy of Rules, which means that they are bound by the terms of the bug bounty program.
                - paragraph [ref=e395]:
                  - strong [ref=e396]: Immunefi Standard Badge
                  - text: Immunefi has satisfied the requirements for the
                  - link "Immunefi Standard Badge" [ref=e397] [cursor=pointer]:
                    - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/15006865432209?utm_source=immunefi
                  - text: ", which is given to projects that adhere to our best practices."
                - paragraph [ref=e398]:
                  - strong [ref=e399]: Invoicing Information
                  - text: "If needed by the security researcher, Immunefi is able to provide the necessary information for the proper issuance of an invoice. This includes:"
