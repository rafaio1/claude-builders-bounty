              - generic [ref=e243]:
                - generic [ref=e244]: Rewards Body
                - generic [ref=e247]:
                  - paragraph [ref=e248]:
                    - text: Rewards are distributed according to the impact of the vulnerability based on the
                    - link "Immunefi Vulnerability Severity Classification System V2.3." [ref=e249] [cursor=pointer]:
                      - /url: https://immunefi.com/immunefi-vulnerability-severity-classification-system-v2-3/
                  - paragraph [ref=e250]:
                    - strong [ref=e251]: Reward Calculation for Critical Level Reports
                  - paragraph [ref=e252]: For critical smart contract bugs, the reward amount is 10% of the funds directly affected up to a maximum of USD $3 Million. The calculation of the amount of funds at risk is based on the time and date the bug report is submitted. However, a minimum reward of USD $100,000 is to be rewarded in order to incentivize security researchers against withholding a critical bug report.
                  - paragraph [ref=e253]:
                    - strong [ref=e254]: Repeatable Attack Limitations
                  - paragraph [ref=e255]: If the smart contract where the vulnerability exists can be upgraded or paused, only the initial attack will be considered for a reward. This is because the project can mitigate the risk of further exploitation by upgrading or pausing the component where the vulnerability exists. The reward amount will depend on the severity of the impact and the funds at risk.
                  - paragraph [ref=e256]: For critical repeatable attacks on smart contracts that cannot be upgraded or paused, the project will consider the cumulative impact of the repeatable attacks for a reward. This is because the project cannot prevent the attacker from repeatedly exploiting the vulnerability until all funds are drained and/or other irreversible damage is done. Therefore, this warrants a reward equivalent to 10% of funds at risk, capped at the maximum critical reward.
                  - paragraph [ref=e257]:
                    - strong [ref=e258]: Reward Calculation for High Level Reports
                  - paragraph [ref=e259]: High vulnerabilities concerning theft/permanent freezing of unclaimed yield/royalties are rewarded within a range of $10k to $75K depending on the funds at risk, capped at the maximum high reward.
                  - paragraph [ref=e260]: In the event of temporary freezing, the reward doubles from the full frozen value for every additional [1h] that the funds are temporarily frozen, up until a max cap of the high reward. This is because as the duration of the freezing lengthens, the potential for greater damage and subsequent reputational harm intensifies. Thus, by increasing the reward proportionally with the frozen duration, the project ensures stronger incentives for bug disclosure of this nature.
                  - paragraph [ref=e261]: "For critical web/apps bug reports will be rewarded with $50,000, only if the impact leads to:"
                  - list [ref=e262]:
                    - listitem [ref=e263]: A loss of funds involving an attack that does not require any user action
                    - listitem [ref=e264]: Private key or private key generation leakage leading to unauthorized access to user funds
                  - paragraph [ref=e265]: All other impacts that would be classified as Critical would be rewarded a flat amount of $20,000. The rest of the severity levels are paid out according to the Impact in Scope table.
                  - paragraph [ref=e266]:
                    - strong [ref=e267]: Reward Payment Terms
                  - paragraph [ref=e268]: Payouts are handled by the Ethena team directly and are denominated in USD. However, payments are done in USDC on Mainnet.
                  - paragraph [ref=e269]: The calculation of the net amount rewarded is based on the average price between CoinMarketCap.com and CoinGecko.com at the time the bug report was submitted. No adjustments are made based on liquidity availability.
              - link "View impacts in scope" [ref=e271] [cursor=pointer]:
                - /url: /bug-bounty/ethena/scope/#impacts
            - generic [ref=e275]:
              - heading "Program Overview" [level=3] [ref=e277]
              - generic [ref=e284]:
                - paragraph [ref=e285]: Ethena is a synthetic dollar protocol built on Ethereum that will provide a crypto-native solution for money not reliant on traditional banking system infrastructure, alongside a globally accessible dollar denominated savings instrument - the 'Internet Bond'.
                - paragraph [ref=e286]: Ethena's synthetic dollar, USDe, provides the crypto-native, scalable solution for money achieved by delta-hedging Ethereum and Bitcoin collateral. USDe is fully backed and free to compose throughout DeFi.
                - paragraph [ref=e287]: USDe peg stability is supported through the use of delta hedging derivatives positions against protocol-held collateral.
                - paragraph [ref=e288]: The 'Internet Bond' combines yield derived from staked Ethereum as well as the funding & basis spread from perpetual and futures' markets, to create the first onchain crypto-native 'bond' that can function as a dollar-denominated savings instrument for users in permitted jurisdictions.
                - paragraph [ref=e289]:
                  - text: For more information about Ethena, please visit
                  - link "https://www.ethena.fi" [ref=e290] [cursor=pointer]:
                    - /url: https://www.ethena.fi/?utm_source=immunefi
                - paragraph [ref=e291]: Ethena provides rewards in USDC on Mainnet, denominated in USD. For more details about the payment process, please view the Rewards by Threat Level section further below.
                - paragraph [ref=e292]:
                  - strong [ref=e293]: KYC Requirement
                - paragraph [ref=e294]: "Ethena will be requesting KYC information in order to pay for successful bug submissions. The following information will be required:"
                - list [ref=e295]:
                  - listitem [ref=e296]: Full name
                  - listitem [ref=e297]: Date of birth
                  - listitem [ref=e298]: Proof of address (either a redacted bank statement with address or a recent utility bill)
                  - listitem [ref=e299]: Copy of Passport or other Government issued ID
                  - listitem [ref=e300]: Eligibility Criteria
                - paragraph [ref=e301]:
                  - strong [ref=e302]: Primacy of Impact vs Primacy of Rules
                - paragraph [ref=e303]: "Ethena adheres to the Primacy of Impact for the following impacts:"
                - list [ref=e304]:
                  - listitem [ref=e305]: Smart Contract - Critical
                  - listitem [ref=e306]: Smart Contract - High
                  - listitem [ref=e307]: Smart Contract - Medium
                  - listitem [ref=e308]: Smart Contract - Low
                  - listitem [ref=e309]: Websites and Applications — Critical
                - paragraph [ref=e310]:
                  - text: Primacy of Impact means that the impact is prioritized rather than a specific asset. This encourages security researchers to report on all bugs with an in-scope impact, even if the affected assets are not in scope. For more information, please see
                  - 'link "Best Practices: Primacy of Impact" [ref=e311] [cursor=pointer]':
                    - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/12340245635089-Best-Practices-Primacy-of-Impact?utm_source=immunefi
                - paragraph [ref=e312]: When submitting a report on Immunefi’s dashboard, the security researcher should select the Primacy of Impact asset placeholder. If the team behind this project has multiple programs, those other programs are not covered under Primacy of Impact for this program. Instead, check if those other projects have a bug bounty program on Immunefi.
                - paragraph [ref=e313]: If the project has any testnet and/or mock files, those will not be covered under Primacy of Impact.
                - paragraph [ref=e314]: All other impacts are considered under the Primacy of Rules, which means that they are bound by the terms and conditions set within this program.
                - paragraph [ref=e315]:
                  - strong [ref=e316]: Public Disclosure of Known Issues
                - paragraph [ref=e317]: Bug reports covering previously-discovered bugs (listed below) are not eligible for a reward within this program. This includes known issues that the project is aware of but has consciously decided not to “fix”, necessary code changes, or any implemented operational mitigating procedures that can lessen potential risk.
                - list [ref=e318]:
                  - listitem [ref=e319]: SOFT_RESTRICTED_STAKER_ROLE can be bypassed by user buying/selling stUSDe on the open market
                  - listitem [ref=e320]: maxRedeemPerBlock does not limit redemption in case of REDEEMER_ROLE key compromise unlike maxMintPerBlock, as the attacker can redeem all collateral held in the contract for 0 USDe, which does not increment maxRedeemPerBlock. This is by design, as limiting unlimited mints was the primary attack vector we wish to eliminate on key compromise and losing all funds currently in minting contract (which will be a small amount taking the total TVL as a reference) is an acceptable outcome.
                  - listitem [ref=e321]: The vesting period for sUSDe is hardcoded to 8 hours while the sUSDe rewards distribution occurs once every week. This means that an experienced user could buy usde => stake right after we transfer => hold for a few hours => sell. We already addressed this issue with the help from the Staking Rewards Distributor smart contract and an offchain component in the form of a cron job, which triggers every 8 hours and sends a slice of the total staking rewards in every run. Distributing the whole amount evenly throughout the week.
                  - listitem [ref=e322]: FULL_RESTRICTED Stakers can bypass restriction through approvals
                - paragraph [ref=e323]:
                  - strong [ref=e324]: Previous Audits
                - paragraph [ref=e325]:
                  - text: Ethena’s completed audit reports can be found at
                  - link "https://ethena-labs.gitbook.io/ethena-labs/resources/audits" [ref=e326] [cursor=pointer]:
                    - /url: https://ethena-labs.gitbook.io/ethena-labs/resources/audits?utm_source=immunefi
                  - text: . Any unfixed vulnerabilities mentioned in these reports are not eligible for a reward.
                - paragraph [ref=e327]:
                  - strong [ref=e328]: Immunefi Standard Badge
                - paragraph [ref=e329]:
                  - text: By adhering to Immunefi’s best practice recommendations, Ethena has satisfied the requirements for the
                  - link "Immunefi Standard Badge." [ref=e330] [cursor=pointer]:
                    - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/15006865432209?utm_source=immunefi
