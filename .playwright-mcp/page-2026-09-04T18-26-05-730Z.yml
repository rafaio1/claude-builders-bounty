            - generic [ref=e392]:
              - heading "Feasibility Limitations" [level=3] [ref=e394]
              - generic [ref=e402]:
                - paragraph [ref=e403]: The project may be receiving reports that are valid (the bug and attack vector are real) and cite assets and impacts that are in scope, but there may be obstacles or barriers to executing the attack in the real world. In other words, there is a question about how feasible the attack really is. Conversely, there may also be mitigation measures that projects can take to prevent the impact of the bug, which are not feasible or would require unconventional action and hence, should not be used as reasons for downgrading a bug's severity.
                - paragraph [ref=e404]: Therefore, Immunefi has developed a set of feasibility limitation standards which by default states what security researchers, as well as projects, can or cannot cite when reviewing a bug report.
                - list [ref=e405]:
                  - listitem [ref=e406]:
                    - link "• Chain Rollbacks" [ref=e407] [cursor=pointer]:
