                  - listitem [ref=e524]: Any testing on mainnet or public testnet deployed code; all testing should be done on local-forks of either public testnet or mainnet
                  - listitem [ref=e525]: Any testing with pricing oracles or third-party smart contracts
                  - listitem [ref=e526]: Attempting phishing or other social engineering attacks against our employees and/or customers
                  - listitem [ref=e527]: Any testing with third-party systems and applications (e.g. browser extensions) as well as websites (e.g. SSO providers, advertising networks)
                  - listitem [ref=e528]: Any denial of service attacks that are executed against project assets
                  - listitem [ref=e529]: Automated testing of services that generates significant amounts of traffic
                  - listitem [ref=e530]: Public disclosure of an unpatched vulnerability in an embargoed bounty
                  - listitem [ref=e531]:
                    - link "Any other actions prohibited by the Immunefi Rules" [ref=e532] [cursor=pointer]:
