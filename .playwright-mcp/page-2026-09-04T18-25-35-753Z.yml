              - generic [ref=e256]:
                - generic [ref=e257]: Rewards Body
                - generic [ref=e260]:
                  - paragraph [ref=e261]:
                    - strong [ref=e262]: Classification & Reward Discretion
                  - paragraph [ref=e263]: Rewards are paid in USDC on Ethereum and are determined based on severity under the Immunefi Vulnerability Severity Classification System (V2.3).
                  - paragraph [ref=e264]:
                    - text: Rewards are broadly based on the principles set forth within the
                    - link "Immunefi Vulnerability Severity Classification System V2.3." [ref=e265] [cursor=pointer]:
                      - /url: https://immunefi.com/immunefi-vulnerability-severity-classification-system-v2-3/
                  - paragraph [ref=e266]: "Final reward amounts are determined by ENS in its sole discretion after assessing factors such as:"
                  - list [ref=e267]:
                    - listitem [ref=e268]: Likelihood of exploitation
                    - listitem [ref=e269]: Scope of affected systems
                    - listitem [ref=e270]: Ease of execution
                    - listitem [ref=e271]: Quality of the report
                    - listitem [ref=e272]: Whether the disclosure was responsible and novel
                    - listitem [ref=e273]: Whether exploitation requires assuming that ENS Labs or its authorized operators act maliciously or are compromised rather than exploiting a flaw in the deployed smart contract logic.
                  - paragraph [ref=e274]: Final amounts will be no less than the respective minimum amounts of each severity level, based on the final severity classification of the bug report. ENS only pays for the first disclosure of a vulnerability. This discretion is exercised in good faith and is subject to mediation.
                  - paragraph [ref=e275]: Depending on the severity and internal assessment, ENS retains the right to reward above the stated amounts at its discretion.
                  - paragraph [ref=e276]:
                    - strong [ref=e277]: The default 10% of funds at risk minimum reward calculation in VSC v2.3 does not apply. The custom critical reward calculation set forth below controls.
                  - heading "External Dependency Discount" [level=3] [ref=e278]
                  - paragraph [ref=e279]: Where a valid vulnerability can only be exploited if a third-party system outside ENS's control fails or behaves abnormally (e.g., oracle failures, bridge compromises, or third-party dependency malfunctions), ENS may reduce the reward by up to 50% to reflect the conditional nature of the risk. This discount does not apply where ENS has the ability to mitigate or protect its users through its own action, in such cases, the full reward applies. Any reduction under this clause must be accompanied by a brief written explanation identifying the specific external dependency and the rationale for the discount applied.
                  - paragraph [ref=e280]: For the sake of clarity, in the event of a conflict between that classification system and the rewards schema set forth below, the below language will control.
                  - heading "Critical Reward Calculation" [level=3] [ref=e281]
                  - paragraph [ref=e282]: "The reward for critical smart contract vulnerabilities is calculated as 10% of funds directly affected, up to a maximum of USD 250,000, calculated as follows:"
                  - table [ref=e283]:
                    - rowgroup [ref=e284]:
                      - row [ref=e285]:
                        - 'columnheader "Base: 10% of funds directly affected, up to $250,000" [ref=e286]'
                        - columnheader "Up to $250,000" [ref=e287]
                    - rowgroup [ref=e288]:
                      - row [ref=e289]:
                        - cell "Where funds directly affected exceed $1,500,000:" [ref=e290]
                        - cell "Minimum $150,000" [ref=e291]
                      - row [ref=e292]:
                        - cell "Where funds directly affected are between $500,000 and $1,500,000:" [ref=e293]
                        - cell "Minimum $75,000" [ref=e294]
                      - row [ref=e295]:
                        - cell "Where funds directly affected are below $500,000, or not objectively calculable" [ref=e296]
                        - cell "Minimum $25,000" [ref=e297]
                      - row [ref=e298]:
                        - 'cell "Where the vulnerability affects fewer than 50 on-chain assets or accounts: reward may be further adjusted downward at the program’s discretion." [ref=e299]'
                        - cell "Minimum $10,000" [ref=e300]
                  - paragraph [ref=e301]:
                    - strong [ref=e302]: Repeatable Attack Limitations
                  - paragraph [ref=e303]:
                    - text: If the smart contract where the vulnerability exists can be upgraded or paused,only the initial attack will be considered for a reward within the mitigation window
                    - strong [ref=e304]: 48 hours for Security Council, 2 weeks for DAO vote.
                    - text: . This is because the project can mitigate the risk of further exploitation by upgrading or pausing the component where the vulnerability exists. The reward amount will depend on the severity of the impact and the funds at risk.
                  - paragraph [ref=e305]: For critical repeatable attacks on smart contracts that cannot be upgraded or paused, the project will consider the cumulative impact of the repeatable attacks for a reward. This is because the project cannot prevent the attacker from repeatedly exploiting the vulnerability until all funds are drained and/or other irreversible damage is done. Therefore, this warrants a reward equivalent to 10% of funds at risk, capped at the maximum critical reward.
                  - heading "High Reward Calculation" [level=3] [ref=e306]
                  - paragraph [ref=e307]: The reward for high-severity smart contract vulnerabilities ranges between USD 25,000 and USD 100,000, based on the assessed impact and funds at risk.
                  - table [ref=e308]:
                    - rowgroup [ref=e309]:
                      - row [ref=e310]:
                        - columnheader "High vulnerabilities concerning theft or permanent freezing of unclaimed yield or royalties are considered at the full amount of funds at risk, capped at the maximum high reward. This is to encourage security researchers to uncover and responsibly disclose vulnerabilities that may not have significant monetary value today but could still be damaging to the project if left unaddressed." [ref=e311]
                        - columnheader "Up to $100,000" [ref=e312]
                    - rowgroup [ref=e313]:
                      - row [ref=e314]:
                        - cell "Temporary freezing of funds is classified as High severity. The reward is determined within the High reward range based on the value of funds affected and the estimated duration of the freeze." [ref=e315]
                        - cell "Up to $100,000" [ref=e316]: Up to$100,000
                      - row [ref=e317]:
                        - cell "In cases where objective calculation is not feasible, there will be a base reward, with the discretion to increase the amount." [ref=e318]
                        - cell "Base $25,000" [ref=e319]
                  - paragraph [ref=e320]:
                    - strong [ref=e321]: "Track B: Websites and Applications"
                  - heading [level=3] [ref=e322]:
                    - strong [ref=e323]: Critical Web / App Reward Calculation
                  - paragraph [ref=e324]:
                    - text: Critical web/application bug reports will be rewarded with USD 25,000,
                    - strong [ref=e325]: only
                    - text: "if the impact leads to:"
                  - list [ref=e326]:
                    - listitem [ref=e327]: A loss of funds involving an attack that does not require any user action
                    - listitem [ref=e328]: Unauthorized minting of tokens on-chain.
                    - listitem [ref=e329]: Private key or private key generation leakage leading to unauthorized access to user funds.
                  - paragraph [ref=e330]:
                    - strong [ref=e331]: "Severity Assessment for XSS Reports:"
                  - list [ref=e332]:
                    - listitem [ref=e333]: Injection of malicious content into app.ens.domains to initiate a malicious transaction without requiring unusual user interaction will be considered critical.
                    - listitem [ref=e334]: Injection of malicious scripts into other ENS subdomains (besides app.ens.domains) that offer web3 wallet connections will be considered high for stored XSS and medium for reflected XSS.
                    - listitem [ref=e335]: XSS on static ENS websites like metadata.ens.domains, which do not offer web3 functionality, will be considered low.
                  - paragraph [ref=e336]:
                    - strong [ref=e337]: Reward Payment Terms
                  - paragraph [ref=e338]: Payouts are handled by the ENS team directly and are denominated in USD. However, payments are done in USDC.
                  - paragraph [ref=e339]: The calculation of the net amount rewarded is based on the average price between CoinMarketCap.com and CoinGecko.com at the time the bug report was submitted. No adjustments are made based on liquidity availability.
                  - heading [level=2] [ref=e340]:
                    - strong [ref=e341]: Eligible Versions
                  - paragraph [ref=e342]: This section defines (1) which code we accept reports against and (2) what is in scope on mainnet versus testnet. A deployment being tagged does not by itself place it in scope, eligibility is set by the rules below.
                  - paragraph [ref=e343]: "We identify code by its Git release tag:"
                  - paragraph [ref=e344]: vx.x.x (e.g. v1.2.3) — a finalized release (no suffix). vx.x.x-RCX (e.g. v1.2.3-RC0) — a release candidate. vx.x.x- (e.g. v1.2.3-testnet) — a pre-release build (e.g. a testnet build).
                  - heading "Mainnet" [level=3] [ref=e345]
                  - paragraph [ref=e346]: Only the latest finalized release (vx.x.x) deployed to mainnet is in scope. Release candidates and other pre-release builds are not eligible on mainnet.
                  - heading "Testnet carve-out" [level=3] [ref=e347]
                  - paragraph [ref=e348]:
                    - strong [ref=e349]: Testnet and staging are out of scope by default.
                    - text: Release candidates and other pre-release builds are handled here, not on mainnet.
                  - paragraph [ref=e350]: "A testnet contract, including a release candidate, **is in scope only if **it meets both of the following:"
                  - paragraph [ref=e351]:
                    - strong [ref=e352]: Version
                    - text: ": its version is greater than or equal to the latest mainnet release. Older or retired versions are out of scope. Recognized deployment: it satisfies at least one of: (a) the contract is included in a tagged GitHub release in an in-scope repository (ens-contracts/releases or contracts-v2/releases); OR (b) the contract address is referenced in official ENS documentation at docs.ens.domains (e.g. the deployments page)."
                  - paragraph [ref=e353]: Any other testnet deployment, including contracts deployed by ENS-controlled accounts but not in a release or referenced in the documentation, is out of scope.
                  - paragraph [ref=e354]: Website and Application testnet and staging deployments are out of scope.
                  - heading "Testnet rewards:" [level=3] [ref=e355]
                  - list [ref=e356]:
                    - listitem [ref=e357]:
                      - strong [ref=e358]: Critical
                      - text: — up to USD 25,000
                    - listitem [ref=e359]:
                      - strong [ref=e360]: High
                      - text: — USD 25,000 (flat)
                    - listitem [ref=e361]:
                      - strong [ref=e362]: Medium
                      - text: — USD 2,500 (flat)
                    - listitem [ref=e363]:
                      - strong [ref=e364]: Low
                      - text: — from USD 1,000 (flat, floor)
                  - paragraph [ref=e365]: V1 contracts will remain in scope during the migration period and will be explicitly removed from scope once migration is complete.
              - link "View impacts in scope" [ref=e367] [cursor=pointer]:
                - /url: /bug-bounty/ens/scope/#impacts
            - generic [ref=e371]:
              - heading "Program Overview" [level=3] [ref=e373]
              - generic [ref=e380]:
                - heading "ENS" [level=4] [ref=e381]
                - paragraph [ref=e382]: The Ethereum Name Service (ENS) is a distributed, open, and extensible naming system based on the Ethereum blockchain.
                - paragraph [ref=e383]: ENS's job is to map human-readable names like 'alice.eth' to machine-readable identifiers such as Ethereum addresses, other cryptocurrency addresses, content hashes, and metadata. ENS also supports 'reverse resolution', making it possible to associate metadata such as canonical names or interface descriptions with Ethereum addresses. ENS has similar goals to DNS, the Internet's Domain Name Service, but has significantly different architecture due to the capabilities and constraints provided by the Ethereum blockchain. Like DNS, ENS operates on a system of dot-separated hierarchical names called domains, with the owner of a domain having full control over subdomains.
                - paragraph [ref=e384]: Top-level domains, like '.eth' and '.test', are owned by smart contracts called registrars, which specify rules governing the allocation of their subdomains. Anyone may, by following the rules imposed by these registrar contracts, obtain ownership of a domain for their own use. ENS also supports importing in DNS names already owned by the user for use on ENS.
                - paragraph [ref=e385]: Because of the hierarchical nature of ENS, anyone who owns a domain at any level may configure subdomains — for themselves or others — as desired. For instance, if Alice owns 'alice.eth', she can create 'pay.alice.eth' and configure it as she wishes.
                - paragraph [ref=e386]: ENS is deployed on the Ethereum main network and on several test networks. If you use a library such as the ensjs Javascript library, or an end-user application, it will automatically detect the network you are interacting with and use the ENS deployment on that network.
                - paragraph [ref=e387]:
                  - text: For more information about ENS, please visit
                  - link "ens.domains" [ref=e388] [cursor=pointer]:
                    - /url: https://ens.domains/?utm_source=immunefi
                - paragraph [ref=e389]: ENS provides rewards in USDC, denominated in USD. For more details about the payment process, please view the Reward Payment Terms section below.
                - paragraph [ref=e390]:
                  - strong [ref=e391]: Immunefi Vault Program
                - paragraph [ref=e392]: The ENS bug bounty program includes a public Immunefi Vault that transparently displays the funds allocated for bug bounty rewards. The vault is deployed on Ethereum and holds assets designated exclusively for vulnerability payouts.
                - paragraph [ref=e393]:
                  - strong [ref=e394]: Immunefi Standard Badge
                - paragraph [ref=e395]: By adhering to Immunefi’s best practice recommendations, ENS has satisfied the requirements for the Immunefi Standard Badge.
                - paragraph [ref=e396]:
                  - strong [ref=e397]: KYC Requirements
                - paragraph [ref=e398]: KYC is generally not required to participate in or receive rewards from the ENS bug bounty program. However, ENS reserves the right to request identity verification or additional information where required by applicable law, payment processors, sanctions compliance or internal risk assessment.
