                - heading "Primacy of Impact vs Primacy of Rules" [level=3] [ref=e221]
                - paragraph [ref=e230]: Cosmos adheres to the Primacy of Rules, which means that the whole bug bounty program is run strictly under the terms and conditions stated within this page.
              - generic [ref=e231]:
                - generic [ref=e232]: Rewards Body
                - generic [ref=e235]:
                  - heading [level=1] [ref=e236]:
                    - strong [ref=e237]: Rewards by Threat Level
                  - paragraph [ref=e238]: Rewards are distributed according to the impact the vulnerability could otherwise cause based on the Impacts in Scope table further below.
                  - paragraph [ref=e239]: Informational reports are not eligible for a reward. Repeated informational or inapplicable submissions will be treated as spam and may result in exclusion from the program.
                  - paragraph [ref=e240]:
                    - strong [ref=e241]: Informational Findings
                  - paragraph [ref=e242]: Findings with no real security consequence, such as cosmetic issues, problems confined to documentation or build tooling that never runs on-chain, behavior that is safe-by-design, or bugs with no demonstrated impact or no demonstrated exploit, are classified as Informational and are not eligible for a reward.
                  - paragraph [ref=e243]:
                    - strong [ref=e244]: Program Wide Severity Downgrade Conditions
                  - paragraph [ref=e245]: "In addition to the impact-specific conditions above, the severity level of a bug report may be downgraded by one severity level where any of the following conditions applies:"
                  - list [ref=e246]:
                    - listitem [ref=e247]:
                      - paragraph [ref=e248]: The attack requires a race condition to occur in which the timing is not within the attacker's control.
                    - listitem [ref=e249]:
                      - paragraph [ref=e250]: Performing the attack requires the attacker to be within a permissioned set, such as a validator within the active set or a user with the ability to deploy contracts on a restricted chain.
                    - listitem [ref=e251]:
                      - paragraph [ref=e252]: The attack requires a governance action to be taken in order for the attack to take place, such as an on-chain consensus parameter change.
                    - listitem [ref=e253]:
                      - paragraph [ref=e254]: The attack requires validator collusion of one third or more, of voting power.
                    - listitem [ref=e255]:
                      - paragraph [ref=e256]: The vulnerability is easily recoverable with built-in tooling that mitigates the impact.
                    - listitem [ref=e257]:
                      - paragraph [ref=e258]: The attack requires a relayer to behave maliciously
                  - paragraph [ref=e259]:
                    - strong [ref=e260]: Important Note for All Bug Reports
                  - paragraph [ref=e261]: While Cosmos aims to provide as clear as possible objective downgrade reasoning in this bug bounty program text, it cannot cover all scenarios that would warrant a downgrade, especially given the uniqueness of the Cosmos structure compared with other bug bounty programs on Immunefi. Because of this, all reports to the Cosmos bug bounty program may be further downgraded by Cosmos separate from or in addition to the downgrade conditions here. The Cosmos team thus retains full discretion on the final severity level of all reports. However, the Cosmos team adheres to providing a reason for all these special additional downgrades.
                  - paragraph [ref=e262]:
                    - strong [ref=e263]: Feasibility Limitations
                  - paragraph [ref=e264]: "The following standard feasibility limitations apply for the bug bounty program:"
                  - list [ref=e265]:
                    - listitem [ref=e266]:
                      - paragraph [ref=e267]:
                        - link "Chain Rollbacks" [ref=e268] [cursor=pointer]:
                          - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/16913153448721-Chain-Rollbacks?utm_source=immunefi
                    - listitem [ref=e269]:
                      - paragraph [ref=e270]:
                        - link "Attack Investment Amount" [ref=e271] [cursor=pointer]:
                          - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/17243068885265-Attack-Investment-Amount?utm_source=immunefi
                    - listitem [ref=e272]:
                      - paragraph [ref=e273]:
                        - link "Attacks With A Financial Risk To The Attacker" [ref=e274] [cursor=pointer]:
                          - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/17454897136401-Attacks-With-A-Financial-Risk-To-The-Attacker?utm_source=immunefi
                    - listitem [ref=e275]:
                      - paragraph [ref=e276]:
                        - link "When Is An Impactful Attack Downgraded To Griefing?" [ref=e277] [cursor=pointer]:
                          - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/17455102268305-When-Is-An-Impactful-Attack-Downgraded-To-Griefing?utm_source=immunefi
                  - paragraph [ref=e278]:
                    - strong [ref=e279]: Proof of Concept (PoC) Requirements
                  - paragraph [ref=e280]: A PoC is required for all bug reports.
                  - list [ref=e281]:
                    - listitem [ref=e282]:
                      - paragraph [ref=e283]: The PoC must be code that can be read and run by the security team. Written descriptions of an attack alone do not count as a valid PoC.
                    - listitem [ref=e284]:
                      - paragraph [ref=e285]: PoCs must demonstrate real user flows. Mock-only or database-only calls are insufficient.
                    - listitem [ref=e286]:
                      - paragraph [ref=e287]: Bug reports without adequate detail may be closed or returned for revision.
                  - paragraph [ref=e288]:
                    - text: A PoC is required for all severity levels. All PoCs submitted must comply with the Immunefi-wide
                    - link "PoC Guidelines and Rules" [ref=e289] [cursor=pointer]:
                      - /url: https://immunefisupport.zendesk.com/hc/en-us/articles/9946217628561-Proof-of-Concept-PoC-Guidelines-and-Rules?utm_source=immunefi
                    - text: ". Bug report submissions without a PoC will not be provided with a reward. For all Medium, High, and Critical reports, the PoC must demonstrate the vulnerability end-to-end on a local 4-node network, from an external point of view. The vulnerability must be shown against the running network as an external actor would encounter it, not in isolation. The following are the requirements for a valid PoC:"
                  - list [ref=e290]:
                    - listitem [ref=e291]: The PoC must spin up a local 4-node network and demonstrate the vulnerability against that running network.
                    - listitem [ref=e292]: The vulnerability must be demonstrated from an external perspective. If the attack requires a malicious node, the PoC may inject the necessary code into a single instance to make it malicious, but the impact must be demonstrated against the network as a whole.
                    - listitem [ref=e293]: The ideal PoC is a self-contained bash script that spins up the network, applies any required modifications, and runs the CLI commands that carry out and prove the attack.
                  - paragraph [ref=e294]: "The following are not accepted as valid PoCs on their own:"
                  - list [ref=e295]:
                    - listitem [ref=e296]: Unit tests
                    - listitem [ref=e297]: Integration tests
                    - listitem [ref=e298]: Written explanations, descriptions, or theoretical demonstrations without a working end-to-end PoC against the local network Reports that do not demonstrate the vulnerability end-to-end on a local network, as described above, will be considered insufficient and will not be eligible for a reward until a valid PoC is provided.
                  - paragraph [ref=e299]:
                    - strong [ref=e300]: Other Terms and Information
                  - list [ref=e301]:
                    - listitem [ref=e302]:
                      - text: Release Policy Requirement - Only released code is eligible for a reward. To be considered valid and in-scope, the issue must exist in released code that is tagged and actively maintained under the
                      - link "Cosmos Release Family Policy" [ref=e303] [cursor=pointer]:
                        - /url: https://docs.cosmos.network/sdk/latest/release-family?utm_source=immunefi#upgrades-and-support
                      - text: . Code that exists only on main, master, or other development branches is not in-scope. In addition, the issue must be exploitable in an intended deployed environment and configuration.
              - link "View impacts in scope" [ref=e305] [cursor=pointer]:
