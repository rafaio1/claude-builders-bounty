                - heading "Pay to Submit" [level=3] [ref=e330]
                - paragraph [ref=e331]: This program uses Immunefi’s pay-to-submit feature. Security researchers may be required to pay a per-report fee, denominated in USDC and paid on-chain from a verified wallet, in order to submit a report.
                - paragraph [ref=e332]: This fee is charged by, and paid to, Immunefi as an operational fee for use of its platform. It is not a fee to Cosmos Labs, is not paid to or recoverable from Cosmos Labs, and is non-refundable regardless of the outcome of the report. Payment of the fee does not guarantee that a report will be triaged, accepted, determined valid, or rewarded, and does not create any relationship, obligation, or entitlement between the security researcher and Cosmos Labs beyond the terms of this policy. Cosmos Labs retains full discretion over the assessment of all reports submitted under this program, consistent with the Primacy of Rules set out above.
