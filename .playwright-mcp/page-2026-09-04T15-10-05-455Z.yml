              - generic [ref=e318]:
                - paragraph [ref=e319]: Cosmos Labs believes that proactively finding and fixing bugs is a vital part of building strong, resilient blockchain protocols. This bug bounty program exists as a public good to actively reward the people who discover bugs in the Cosmos Stack. The Cosmos Stack includes distributed systems protocols, cryptography, a smart contract platform, a consensus algorithm, and an interoperability protocol. The focus of this program is on surfacing vulnerabilities in the protocols, modules, and infrastructure that make up the Cosmos Stack. It is not the right place to search for web application vulnerabilities such as XSS, CSRF, and header misconfigurations.
