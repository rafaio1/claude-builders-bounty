              - generic [ref=f1e510]:
                - generic [ref=f1e511]: Program's Out of Scope information
                - generic [ref=f1e514]:
                  - heading "Out of Scope & Rules" [level=1] [ref=f1e515]
                  - paragraph [ref=f1e516]: These impacts are out of scope for this bug bounty program.
                  - paragraph [ref=f1e517]: All Categories
                  - list [ref=f1e518]:
                    - listitem [ref=f1e519]:
                      - paragraph [ref=f1e520]: Issues requiring a previously compromised environment to exploit (e.g. a compromised node or a majority-compromised consensus).
                    - listitem [ref=f1e521]:
                      - paragraph [ref=f1e522]: Assets not explicitly listed as in-scope, including assets not owned by participating teams.
                    - listitem [ref=f1e523]:
                      - paragraph [ref=f1e524]: Issues already publicly or privately addressed, and issues fixed upstream.
                    - listitem [ref=f1e525]:
                      - paragraph [ref=f1e526]: Downstream effects of previously resolved bounty issues.
                    - listitem [ref=f1e527]:
                      - paragraph [ref=f1e528]: Third-party services and websites.
                    - listitem [ref=f1e529]:
                      - paragraph [ref=f1e530]: Web vulnerabilities, including but not limited to XSS, CSRF, CORS, cookie flags, TLS configuration, headers, and email configuration.
                    - listitem [ref=f1e531]:
                      - paragraph [ref=f1e532]: Documented configuration behaviors in expected deployment scenarios.
                    - listitem [ref=f1e533]:
                      - paragraph [ref=f1e534]: Governance misconfiguration-specific issues.
                    - listitem [ref=f1e535]:
                      - paragraph [ref=f1e536]: Package registry or dependency management issues without Cosmos-specific exploit PoCs, and dependency vulnerability reports without demonstrated impact on in-scope systems.
                    - listitem [ref=f1e537]:
                      - paragraph [ref=f1e538]: Scanner-generated, automated, or informational-only reports without demonstrated impact.
                    - listitem [ref=f1e539]:
                      - paragraph [ref=f1e540]: Architectural critiques without immediate exploitability.
                    - listitem [ref=f1e541]:
                      - paragraph [ref=f1e542]: Vulnerabilities caused by user error or misconfiguration by the user, going against documented operational procedures.
                    - listitem [ref=f1e543]:
                      - paragraph [ref=f1e544]: Vulnerabilities requiring privileged access to a local network or machine, without demonstrating how that access is gained.
                    - listitem [ref=f1e545]:
                      - paragraph [ref=f1e546]: Impacts requiring attacks that the reporter has already exploited themselves, leading to damage.
                    - listitem [ref=f1e547]:
                      - paragraph [ref=f1e548]: Impacts caused by attacks requiring access to leaked keys/credentials.
                    - listitem [ref=f1e549]:
                      - paragraph [ref=f1e550]: Impacts caused by attacks requiring access to privileged addresses without additional modification of the privileges attributed. For avoidance of doubt, attacks requiring membership of a permissioned participant set (for example, an active-set validator) are handled under the Program Wide Severity Downgrade Conditions rather than this exclusion.
                    - listitem [ref=f1e551]:
                      - paragraph [ref=f1e552]: Impacts requiring phishing or other social engineering attacks against project employees and/or users.
                    - listitem [ref=f1e553]:
                      - paragraph [ref=f1e554]: Best practice recommendations.
                    - listitem [ref=f1e555]:
                      - paragraph [ref=f1e556]: Feature requests.
                    - listitem [ref=f1e557]:
                      - paragraph [ref=f1e558]: Impacts on test files and configuration files unless stated otherwise in the bug bounty program.
                    - listitem [ref=f1e559]:
                      - paragraph [ref=f1e560]: Attacks where the cost of executing an attack is greater than the potential or deterministically proven impact in terms of damage caused.
                    - listitem [ref=f1e561]:
                      - paragraph [ref=f1e562]: Incorrect data supplied by third party oracles. This does not exclude oracle manipulation attacks.
                    - listitem [ref=f1e563]:
                      - paragraph [ref=f1e564]: Impacts involving centralization risks.
                    - listitem [ref=f1e565]:
                      - paragraph [ref=f1e566]: Attacks that require honest users to directly interact with, transfer to, or deposit into a malicious chain, IBC channel/client, or contract on their own.
                  - heading "The following activities are prohibited by this bug bounty program:" [level=3] [ref=f1e567]
                  - list [ref=f1e568]:
                    - listitem [ref=f1e569]:
                      - paragraph [ref=f1e570]: Any testing against live mainnet or public testnet networks, deployed code, or production infrastructure. All testing should be done on local forks, local test clusters, or private deployments.
                    - listitem [ref=f1e571]:
                      - paragraph [ref=f1e572]: Any denial of service attacks executed against project assets or live networks.
                    - listitem [ref=f1e573]:
                      - paragraph [ref=f1e574]: Automated testing of services that generate significant amounts of traffic.
                    - listitem [ref=f1e575]:
                      - paragraph [ref=f1e576]: Violating the privacy of users, disrupting production systems, destroying data, or harming the user experience.
                    - listitem [ref=f1e577]:
                      - paragraph [ref=f1e578]: Accessing more data than is required for a proof of concept. If sensitive user data (PII, PHI, financial data, or proprietary information) is encountered, testing must cease immediately and a bug report must be submitted.
                    - listitem [ref=f1e579]:
                      - paragraph [ref=f1e580]: Using accounts other than test accounts the security researcher owns or has explicit permission to use.
                    - listitem [ref=f1e581]:
                      - paragraph [ref=f1e582]: Attempting phishing or other social engineering attacks against project employees and/or users.
                    - listitem [ref=f1e583]:
                      - paragraph [ref=f1e584]: Any testing with third-party systems, applications, or websites.
                    - listitem [ref=f1e585]:
                      - paragraph [ref=f1e586]: Public disclosure of an unpatched vulnerability, or disclosure of a vulnerability before it is remediated and disclosure is approved.
                    - listitem [ref=f1e587]:
                      - paragraph [ref=f1e588]: Extortion or other coercive behavior.
                    - listitem [ref=f1e589]:
                      - paragraph [ref=f1e590]: Any other actions prohibited by the Immunefi Rules.
                  - heading "Other Terms and Information:" [level=3] [ref=f1e591]
                  - list [ref=f1e592]:
                    - listitem [ref=f1e593]:
                      - paragraph [ref=f1e594]: Gaia - Gaia is included only as a reference implementation of the Cosmos Stack. All Cosmos Hub-specific features, third-party modules, and non-core functionality in the Gaia repository are out-of-scope.
                    - listitem [ref=f1e595]:
                      - paragraph [ref=f1e596]:
                        - text: Cosmos SDK modules - Following
                        - link "https://github.com/cosmos/cosmos-sdk/pull/25090" [ref=f1e597] [cursor=pointer]:
                          - /url: https://github.com/cosmos/cosmos-sdk/pull/25090?utm_source=immunefi
                        - text: ", the x/group, x/circuit, x/crisis, and x/nft modules are no longer maintained and are not in-scope. Bug reports on maintained Cosmos SDK modules other than those highlighted in the Assets in Scope section are also accepted, provided the module is covered by the Release Family Policy."
                    - listitem [ref=f1e598]:
                      - paragraph [ref=f1e599]: Cosmos EVM - The x/precisebank module in Cosmos EVM is not covered by this bug bounty program and is no longer maintained. Older versions of this software will not be patched, and users are urged to no longer use it.
                    - listitem [ref=f1e600]:
                      - paragraph [ref=f1e601]: iavl - The iaviewer application itself is not in-scope, unless there is an underlying bug in the iavl library that can be exploited through the application or through other applications using the iavl library.
                    - listitem [ref=f1e602]:
                      - paragraph [ref=f1e603]: When an issue is on track to be mitigated or remediated, Cosmos Labs will coordinate with the security researcher to credit the finding in advisories and release notes, and to support disclosure of valid issues after remediation.
                    - listitem [ref=f1e604]:
                      - paragraph [ref=f1e605]: "Memory Exhaustion (OOM) Reports - Minimum Threshold: For reports demonstrating an out-of-memory (OOM) condition through increased node memory consumption, the report must demonstrate a memory increase that exceeds 16 GB in order to be considered valid. Reports that do not demonstrate memory consumption above this threshold will be considered out of scope, as they do not sufficiently prove the ability to exhaust a node's memory and cause a crash."
