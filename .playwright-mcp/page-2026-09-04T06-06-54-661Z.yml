                              - listitem [ref=e635]:
                                - text: The save path still returns a synthetic
                                - code [ref=e636]: "${originalImageUri}-edited-${Date.now()}"
                                - text: string. There is no image processing layer yet, so rotate/crop/adjust/annotation changes are not rendered into a real edited asset or persisted as a new file/version.
                              - listitem [ref=e637]: The UI currently supports only rotate plus undo/redo. The bounty also calls for crop, brightness, contrast, saturation, pen/text/arrow/highlight annotations, and a clear separation between editor UI, processing layer, and shared helpers.
