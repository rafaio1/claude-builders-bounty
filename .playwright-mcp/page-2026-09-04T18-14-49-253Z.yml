              - heading "Impacts in Scope" [level=3] [ref=e677]
              - generic [ref=e680]:
                - generic [ref=e681]: Impacts Body
                - generic [ref=e684]:
                  - paragraph [ref=e685]: The Critical Blockchian/DLT impact “Network not being able to confirm new transactions (total network shutdown)” is only able to be considered at Critical if the fix requires a manual rollback. Otherwise, the severity level may be downgraded by at least one severity level. The same applies for the Critical Blockchain/DLT impact “Unintended permanent freezing of funds”.
                  - paragraph [ref=e686]: Any impact requiring an attack vector that involves a privileged account, defined as one that is of the Hedera team or one that is required to receive approval from the Hedera team, directly or indirectly, may be downgraded by at least one severity level or be considered as out of scope entirely due to certain permissioned aspects of the Hedera network.
                  - paragraph [ref=e687]: For the Medium Blockchain/DLT impact “Incorrect or missing records exported to mirror nodes”, this is limited to consensus-critical or financially significant records, including, but not limited to account balances, token balances, or other authoritative ledger state. All others, such as incorrect or missing records that are non-authoritative, derived, informational, or statistical in nature, may be considered as out of scope.
                  - paragraph [ref=e688]: The following list is the max we pay for a specific impact. It can only be less, not more.
                  - paragraph [ref=e689]:
                    - strong [ref=e690]: Suggestions for places to start
                  - list [ref=e691]:
                    - listitem [ref=e692]: Ability to execute system commands
                    - listitem [ref=e693]: Signing transactions for other users
                    - listitem [ref=e694]: Redirection of user deposits and withdrawals
                    - listitem [ref=e695]: Tamper/manipulate Hashgraph history to invalidate transactions
                    - listitem [ref=e696]: Tampering with submitted transactions
                    - listitem [ref=e697]: Authorizing transactions without approval from the required signers/owners
                    - listitem [ref=e698]: Preventing network from reaching consensus on transactions that are submitted
                    - listitem [ref=e699]: Preventing gossip of a transaction or multiple transactions
                    - listitem [ref=e700]: Bugs that cause the in-scope service to crash (e.g., Non-network-based DoS)
                    - listitem [ref=e701]: Remote code execution vulnerabilities
                    - listitem [ref=e702]: Attacks that cause a probabilistic consensus failure; or a deterministic consensus failure in reconnected nodes
                    - listitem [ref=e703]: Effective non-network-bandwidth-flooding DDoS attacks (e.g., transaction hammering)
                    - listitem [ref=e704]: Malicious capabilities of Hedera Token Service functions exposed via System contracts (e.g. transferring assets out of an account without permissions).
                    - listitem [ref=e705]: System Smart contract modifiers not respected
                    - listitem [ref=e706]: Bugs in the economic system to defraud other participants (e.g. avoid transaction fees to full nodes)
                    - listitem [ref=e707]: Prevent node from accessing the network
                    - listitem [ref=e708]: Incorrect or missing records exported to mirror nodes
                    - listitem [ref=e709]: Correct transaction fees not being applied
                    - listitem [ref=e710]: Unauthorized Hedera Token Service (HTS) activity
                    - listitem [ref=e711]: Overpayment or underpayment of staking rewards
                    - listitem [ref=e712]: Theft of unpaid staking rewards
                    - listitem [ref=e713]: Sensitive information leakage (e.g., private keys, wallets credentials etc). Public keys are excluded from this scope
